name = "cuotiben-api"
main = "index.js"
compatibility_date = "2026-01-01"

# 面板上建好之后，把 database_id 填进来
[[d1_databases]]
binding = "DB"
database_name = "cuotiben"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"

# 图片存 Worker KV（免费 1GB、开通不需要绑卡，R2 的替代）
# 面板：存储和数据库 → KV → 创建命名空间（名字随意，如 cuotiben-images），把 Namespace ID 填进来
[[kv_namespaces]]
binding = "IMAGES"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# PUSH_TOKEN 不写在这里 —— 用 `wrangler secret put PUSH_TOKEN` 设置，
# 免得跟着仓库一起进 GitHub
