<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="320" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00ff88" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 手柄外壳 - 更圆润现代感 -->
  <path d="M 55 135 
           Q 45 115 55 92 
           L 465 92 
           Q 475 115 465 135 
           L 55 135 Z" 
        fill="#1a1a1a" 
        stroke="#2f2f2f" 
        stroke-width="22" 
        filter="url(#shadow)"/>

  <!-- 机身金属质感高光 -->
  <path d="M 55 135 
           Q 45 115 55 92 
           L 465 92 
           Q 475 115 465 135 
           L 55 135 Z" 
        fill="none" 
        stroke="#3a3a3a" 
        stroke-width="8" 
        opacity="0.25"/>

  <!-- 左摇杆外壳 -->
  <circle cx="125" cy="148" r="42" fill="#181818" stroke="#3a3a3a" stroke-width="9"/>

  <!-- 左摇杆杆 -->
  <circle cx="125" cy="148" r="23" fill="#2c2c2c" filter="url(#glow)"/>

  <!-- 右摇杆外壳 -->
  <circle cx="395" cy="148" r="42" fill="#181818" stroke="#3a3a3a" stroke-width="9"/>

  <!-- 右摇杆杆 -->
  <circle cx="395" cy="148" r="23" fill="#2c2c2c" filter="url(#glow)"/>

  <!-- A 按钮（发光绿色） -->
  <circle cx="320" cy="228" r="28" fill="#00dd55" stroke="#ffffff" stroke-width="6" filter="url(#glow)"/>

  <!-- B 按钮（发光红色） -->
  <circle cx="268" cy="228" r="28" fill="#ff2266" stroke="#ffffff" stroke-width="6" filter="url(#glow)"/>

  <!-- X 按钮（发光红色） -->
  <circle cx="216" cy="178" r="28" fill="#ff2266" stroke="#ffffff" stroke-width="6" filter="url(#glow)"/>

  <!-- Y 按钮（发光绿色） -->
  <circle cx="164" cy="178" r="28" fill="#00dd55" stroke="#ffffff" stroke-width="6" filter="url(#glow)"/>

  <!-- D-pad - 更精致 -->
  <g transform="translate(78, 78)">
    <polygon points="0,25 25,0 50,25 25,50" fill="#333333" stroke="#cccccc" stroke-width="7"/>
    <polygon points="25,25 25,15 15,25" fill="#222222" stroke="#cccccc" stroke-width="3"/>
  </g>

  <!-- 左肩键 LB -->
  <rect x="62" y="42" width="105" height="32" rx="14" fill="#444444" stroke="#999" stroke-width="5" rx="8"/>

  <!-- 右肩键 RB -->
  <rect x="353" y="42" width="105" height="32" rx="14" fill="#444444" stroke="#999" stroke-width="5" rx="8"/>

  <!-- 左扳机 -->
  <rect x="98" y="72" width="32" height="16" rx="7" fill="#777777" stroke="#999" stroke-width="4"/>

  <!-- 右扳机 -->
  <rect x="390" y="72" width="32" height="16" rx="7" fill="#777777" stroke="#999" stroke-width="4"/>

  <!-- 标题 -->
  <text x="260" y="32" font-family="Microsoft YaHei, Arial Black, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
    GAMEPAD
  </text>

  <!-- 副标题 -->
  <text x="260" y="295" font-family="Arial" font-size="13" fill="#666666" text-anchor="middle">
    高级 Xbox 风格 • 精美设计
  </text>
</svg>
