<svg width="520" height="380" viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">
  <!-- 手柄主体外壳 -->
  <rect x="95" y="145" width="155" height="95" rx="35" ry="35" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="18"/>
  <rect x="255" y="145" width="155" height="95" rx="35" ry="35" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="18"/>
  <rect x="195" y="155" width="130" height="75" rx="25" ry="25" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="12"/>

  <!-- 肩键 -->
  <rect x="115" y="115" width="48" height="18" rx="6" ry="6" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="6"/>
  <rect x="357" y="115" width="48" height="18" rx="6" ry="6" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="6"/>

  <!-- 触发键 -->
  <rect x="125" y="85" width="38" height="22" rx="4" ry="4" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="5"/>
  <rect x="357" y="85" width="38" height="22" rx="4" ry="4" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="5"/>

  <!-- 方向键 -->
  <rect x="125" y="195" width="78" height="78" rx="8" ry="8" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="6"/>
  <rect x="148" y="195" width="32" height="18" rx="3" ry="3" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="148" y="265" width="32" height="18" rx="3" ry="3" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="125" y="213" width="18" height="32" rx="3" ry="3" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="177" y="213" width="18" height="32" rx="3" ry="3" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="4"/>

  <!-- 左摇杆 -->
  <circle cx="195" cy="265" r="22" fill="#1a1a1a" stroke="#0f0f0f" stroke-width="6"/>
  <circle cx="195" cy="265" r="14" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="4"/>

  <!-- 右摇杆 -->
  <circle cx="325" cy="265" r="22" fill="#1a1a1a" stroke="#0f0f0f" stroke-width="6"/>
  <circle cx="325" cy="265" r="14" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="4"/>

  <!-- 菜单按钮 -->
  <circle cx="125" cy="155" r="11" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="5"/>
  <circle cx="395" cy="155" r="11" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="5"/>

  <!-- 主按钮 -->
  <circle cx="260" cy="260" r="13" fill="#1f1f1f" stroke="#0f0f0f" stroke-width="6"/>

  <!-- ABXY 按键 -->
  <circle cx="325" cy="195" r="14" fill="#00aaff" stroke="#0088cc" stroke-width="5"/>
  <circle cx="365" cy="195" r="14" fill="#ff2d55" stroke="#cc0022" stroke-width="5"/>
  <circle cx="325" cy="235" r="14" fill="#00ff88" stroke="#00cc44" stroke-width="5"/>
  <circle cx="365" cy="235" r="14" fill="#ffdd00" stroke="#ccaa00" stroke-width="5"/>
