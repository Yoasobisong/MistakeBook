name: 部署

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 网页端要知道 API 地址；同域部署时留空即可走相对路径
      - run: npm run build:web
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}

      - name: 部署前端到 Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=cuotiben

      - name: 部署 Worker
        # wrangler.toml 含真实 D1/KV ID，已 .gitignore 不进仓库。
        # 部署前从仓库的 wrangler.toml.example 生成一份，ID 用 secrets 注入。
        run: |
          cp worker/wrangler.toml.example worker/wrangler.toml
          sed -i "s/PUT_YOUR_D1_DATABASE_ID_HERE/${{ secrets.CF_D1_DATABASE_ID }}/" worker/wrangler.toml
          sed -i "s/PUT_YOUR_KV_NAMESPACE_ID_HERE/${{ secrets.CF_KV_NAMESPACE_ID }}/" worker/wrangler.toml
          npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
